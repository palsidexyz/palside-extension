[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["vendor"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin/", "forge-std/=vendor/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
